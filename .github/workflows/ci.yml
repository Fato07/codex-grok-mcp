name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20.19.2, 22, 24]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json

      - run: npm ci --no-audit
      - run: npm ci --prefix relay --no-audit
      - run: npm run test:all

      - name: Audit dependencies
        # Node 22 bundles npm 10, whose quick-audit endpoint is retired.
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          audit_with_retry() {
            npm audit "$@" --fetch-retries=0 --fetch-timeout=180000 || {
              sleep 5
              npm audit "$@" --fetch-retries=0 --fetch-timeout=180000
            }
          }
          audit_with_retry --omit=dev
          audit_with_retry --prefix relay

      - name: Inspect package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm pack --dry-run
